name: Daily Audio Sale Update & Deploy Pages

on:
  schedule:
    # 毎日 UTC 0:00 (日本時間 JST 09:00) に自動実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # GitHub Actions 画面からの手動テスト実行に対応

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-data-update"
  cancel-in-progress: false

jobs:
  curate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Audio Sale Tracker curation batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          python -m src.main

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/sales.json state/seen_urls.json
          if git diff --cached --quiet; then
            echo "データに差分がないためコミットをスキップします。"
          else
            git commit -m "chore(data): update audio sale items [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

